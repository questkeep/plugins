name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: --online compares versions.json with origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Script tests
        run: node --test scripts/*.test.mjs

      - name: Validate entries
        run: node scripts/validate.mjs

      # Downloads the new versions of a pull request and checks hash, size and plugin.json.
      - name: Validate new versions online
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --online

      - name: Build index
        run: node scripts/build-index.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
